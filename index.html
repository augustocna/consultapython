<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Python Salva-vidas</title>

    <!-- Esconde a página até o tema carregar (evita piscar sem estilo). -->
    <script>document.documentElement.classList.add('is-loading');</script>

    <!-- O tema do Bootswatch, as fontes e o highlight.js são carregados pelo
         JavaScript a partir do js/config.js e entram ANTES deste arquivo,
         para que o css/style.css sempre tenha a palavra final. -->
    <link id="app-css" rel="stylesheet" href="css/style.css">

    <script src="js/config.js" defer></script>
    <script src="js/content.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <a id="skip-link" class="skip-link" href="#main">Pular para o conteúdo</a>

    <!-- ===================== BARRA DO TOPO ===================== -->
    <nav class="navbar app-navbar bg-primary" aria-label="Barra superior">
        <div class="app-navbar-inner">
            <button id="btn-menu" class="btn-menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir índice">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            </button>

            <a id="brand" class="app-brand" href="#" data-action="home">
                <span id="brand-icon" aria-hidden="true"></span>
                <span id="brand-text"></span>
            </a>

            <div class="search-box" role="search">
                <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input id="search" class="form-control search-input" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search">
                <kbd id="search-kbd" class="search-kbd" aria-hidden="true">/</kbd>
                <button id="search-clear" class="search-clear d-none" type="button" data-action="clear-filters">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="app-layout">
        <!-- ===================== ÍNDICE LATERAL ===================== -->
        <aside id="sidebar" class="app-sidebar" aria-label="Índice">
            <div id="level-filter" class="btn-group level-filter" role="group"></div>
            <nav id="toc" class="toc" aria-label="Tópicos"></nav>
            <div id="theme-picker" class="theme-picker">
                <label id="theme-label" for="theme-select" class="form-label">Tema</label>
                <select id="theme-select" class="form-select form-select-sm"></select>
            </div>
        </aside>
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- ===================== CONTEÚDO ===================== -->
        <main id="main" class="app-main" tabindex="-1">
            <header id="hero" class="hero">
                <h1 id="hero-title"></h1>
                <p id="hero-subtitle" class="hero-subtitle"></p>
                <p id="hero-hint" class="hero-hint"></p>
                <div id="shortcuts" class="shortcut-grid"></div>
            </header>

            <div id="search-status" class="search-status d-none" role="status" aria-live="polite">
                <span id="search-status-text"></span>
                <button id="search-status-btn" type="button" class="btn btn-sm btn-ghost" data-action="clear-filters"></button>
            </div>

            <div id="empty-state" class="empty-state d-none">
                <p id="empty-title" class="empty-title"></p>
                <p id="empty-hint" class="empty-hint"></p>
                <button id="empty-btn" type="button" class="btn btn-sm btn-ghost" data-action="clear-filters"></button>
            </div>

            <div id="content"></div>

            <footer class="app-footer">
                <p id="footer-text"></p>
            </footer>
        </main>
    </div>

    <button id="back-to-top" class="back-to-top" type="button" data-action="back-to-top" aria-label="Voltar ao topo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
    </button>

    <div id="toast" class="app-toast" role="status" aria-live="polite"></div>

    <noscript>
        <p class="noscript">Este guia precisa do JavaScript ativado para mostrar o conteúdo.</p>
    </noscript>
</body>
</html>
